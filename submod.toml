[defaults]
update = "rebase"

[llvm-project]
path = "third-party/llvm-project"
url = "https://github.com/minghu6/llvm-project"
branch = "release/12.x.m6.fix"
use_git_default_sparse_checkout = true
sparse_paths = [
    "/llvm/",
    "/.gitignore"
]

[inkwell]
path = "third-party/inkwell"
url = "https://github.com/minghu6/inkwell.git"
branch = "m6/llvm-12"
use_git_default_sparse_checkout = false
