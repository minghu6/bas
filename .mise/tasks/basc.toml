#:schema https://mise.jdx.dev/schema/mise-task.json

["basc:run"]
description = "Compile and run an example: mise run basc:run <name> [flags...]"
depends = ["bas:get:basc", "bas:get:lib"]
run = """
set -e
if [ $# -eq 0 ]; then echo "Usage: mise run basc:run <name> [flags...]" >&2; exit 1; fi
RUST_BACKTRACE=1 ./basc "./examples/$1.bath" "$1" "${@:2}"
./"$1"
"""

["basc:compile"]
description = "Compile an example without running it"
usage = '''
arg "<example>" help="Example name, without the .bath suffix"
arg "[flags]" var=#true help="Extra flags forwarded to basc"
'''
depends = ["bas:get:basc", "bas:get:lib"]
run = '''
set -e
RUST_BACKTRACE=1 ./basc "./examples/${usage_example?}.bath" \
  "${usage_example?}" ${usage_flags:-}
'''

["basc:dump"]
description = 'Objdump the output.o'
run = 'objdump -xsd ./output.o'

["basc:verify:exp0"]
depends = ["basc:compile exp0"]
raw = true
run = './exp0'

["basc:verify:test_sepc"]
depends = ["basc:compile test_spec"]