#:schema https://mise.jdx.dev/schema/mise-task.json

["llvmenv:build-llvm:configure"]
description = "Configure LLVM {{ vars.llvm_version }} build"
dir = "llvmenv"
run = """
if [ ! -e {{ vars.llvm_root }}/llvm/CMakeLists.txt ]; then
  echo 'llvm source tree missing: fetch third-party submodules first' >&2
  exit 1
fi

if ! RES="$(./build-resource-config configure)"; then exit 1; fi
eval "$RES"

{{ vars.llvmenv_run }} cmake -G "Ninja" \
  {{ vars.llvm_cmake_static_flags }} \
  -DLLVM_PARALLEL_LINK_JOBS="${LLVMENV_LINK_JOBS}" \
  -S llvm \
  -B build
"""

["llvmenv:build-llvm:build"]
description = "Build LLVM {{ vars.llvm_version }} with ninja"
dir = "llvmenv"
run = """
if [ ! -e {{ vars.llvm_root }}/build/build.ninja ]; then
  echo 'nothing configured: run llvmenv:build-llvm:configure first' >&2
  exit 1
fi

if ! RES="$(./build-resource-config build)"; then exit 1; fi
eval "$RES"

LLVMENV_EXTRA_ARGS="--memory=${LLVMENV_MEM_MIB}m --memory-swap=${LLVMENV_MEM_MIB}m"
{{ vars.llvmenv_run_head }} ${LLVMENV_EXTRA_ARGS:-} {{ vars.llvmenv_image_tag }} \
  ninja -C build -j"${LLVMENV_NINJA_JOBS}"
"""

["llvmenv:build-llvm:install"]
description = """
Install LLVM {{ vars.llvm_version }} into {{ vars.llvm_home }} \
(self-contained closure)"""
dir = "llvmenv"
run = """
if [ ! -e {{ vars.llvm_root }}/build/cmake_install.cmake ]; then
  echo 'nothing built: run llvmenv:build-llvm:build first' >&2
  exit 1
fi

if [ ! -d {{ vars.llvm_home }} ] || [ ! -w {{ vars.llvm_home }} ]; then
  echo "info: creating {{ vars.llvm_home }} (needs sudo)" >&2
  sudo mkdir -p {{ vars.llvm_home }}
  sudo chown "$(id -u):$(id -g)" {{ vars.llvm_home }}
fi

if [ -n "$(ls -A {{ vars.llvm_home }})" ]; then
  printf 'existing install in {{ vars.llvm_home }}; overwrite? [y/N] ' >&2
  read -r ans
  case "$ans" in
    [yY]*) ;;
    *) echo 'aborted' >&2; exit 1 ;;
  esac
fi

# 1) install LLVM into the prefix (podman options MUST precede the image tag)
{{ vars.llvmenv_run_head }} -v "{{ vars.llvm_home }}":"{{ vars.llvm_home }}" {{ vars.llvmenv_image_tag }} \
  cmake -DCMAKE_INSTALL_PREFIX="{{ vars.llvm_home }}" -P build/cmake_install.cmake

# 2) vendor deps so the prefix resolves independently of the host
{{ vars.llvmenv_run_head }} -v "{{ vars.llvm_home }}":"{{ vars.llvm_home }}" \
  -v "$PWD:/${PWD##*/}" -w "/${PWD##*/}" {{ vars.llvmenv_image_tag }} \
  ./bundle-runtime-libs "{{ vars.llvm_home }}"
"""

["llvmenv:build-llvm:reconfigure"]
description = """
Alias of llvmenv:build-llvm:configure (re-apply the \
changed argument value in place)"""
depends = ["llvmenv:build-llvm:configure"]

["llvmenv:build-llvm:reconfigure-fresh"]
description = "Delete the CMake cache, then configure from scratch"
run = """
rm -f {{ vars.llvm_root }}/build/CMakeCache.txt
rm -rf {{ vars.llvm_root }}/build/CMakeFiles
echo "cache cleared; configuring from scratch"
"""
depends_post = ["llvmenv:build-llvm:configure"]
