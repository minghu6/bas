[settings]
task.quiet = true

[env]
_.path = ["{{ vars.llvm_home }}/bin"]  # prepend to shell (`mise activate` tells) PATH
# LLVM_SYS_120_PREFIX = "{{ vars.llvm_home }}"

# mise renders vars top-down
[vars]
llvm_version = "12"
llvm_home = "/usr/local/llvm-{{ vars.llvm_version }}"
llvm_root = "{{ config_root }}/third-party/llvm-project"
llvm_sparse_paths = "/llvm/ /.gitignore"
llvmenv_image_base_distro = "ubuntu"
llvmenv_image_base_version = "22.04"
llvmenv_image_base = "{{ vars.llvmenv_image_base_distro }}{{ vars.llvmenv_image_base_version }}"
llvmenv_image_tag = "{{ vars.llvm_version }}-{{ vars.llvmenv_image_base }}"
llvmenv_image_registry_hwc_qd = "swr.cn-east-5.myhuaweicloud.com"
llvmenv_image_registry_hwc_sh_1 = "swr.cn-east-3.myhuaweicloud.com"
llvmenv_image_registry_tc = "ccr.ccs.tencentyun.com"
llvmenv_image_registry_aliyun = "crpi-y7qpip8hchxrp368.cn-hangzhou.personal.cr.aliyuncs.com"
llvmenv_image_registry_quay = "quay.io"
llvmenv_image_registry_ghcr = "ghcr.io"
llvmenv_image_org = "minghu6"
llvmenv_image_repo = "llvm-builder-image"
llvmenv_local_manifest = "localhost/{{ vars.llvmenv_image_org }}/{{ vars.llvmenv_image_repo }}:{{ vars.llvmenv_image_tag }}"
llvmenv_multiarch_oci_dir = "{{ config_root }}/llvmenv/multiarch-oci"

llvmenv_run_head = """
podman run --rm --userns=keep-id \
  -v "{{ vars.llvm_root }}":/llvm-project \
  -w /llvm-project"""
llvmenv_run = "{{ vars.llvmenv_run_head }} {{ vars.llvmenv_image_tag }} "
llvm_cmake_static_flags = """\
-DLLVM_TARGETS_TO_BUILD="X86;AArch64;ARM;RISCV;WebAssembly" \
-DLLVM_BUILD_LLVM_DYLIB=ON \
-DLLVM_LINK_LLVM_DYLIB=ON \
-DCMAKE_POLICY_DEFAULT_CMP0116=OLD \
-DCMAKE_CXX_FLAGS="-Wno-deprecated -Wno-deprecated-copy" \
-DCMAKE_CXX_STANDARD=17 \
-DCMAKE_BUILD_TYPE=RelWithDebInfo \
-DCMAKE_CXX_COMPILER=clang++-{{ vars.llvm_version }} \
-DCMAKE_C_COMPILER=clang-{{ vars.llvm_version }} \
-DLLVM_USE_LINKER=lld-{{ vars.llvm_version }} \
-DLLVM_INCLUDE_DOCS=OFF \
"""
inkwell_root = "{{ config_root }}/third-party/inkwell"