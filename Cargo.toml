cargo-features = ["different-binary-name"]

[package]
name = "bas"
version = "0.1.0"
edition = "2024"

[dependencies]
inkwell = { path = "third-party/inkwell", features = ["llvm12-0"] }
inkwellkit = { path = "inkwellkit" }
inkwellkit_macros = { path = "inkwellkit/proc_macros" }
m6parserkit = { git = "https://github.com/minghu6/m6syntax", branch = "bas" }
m6entry = { path = "vendor/m6entry" }

clap = { version = "3", features = ["derive"] }
clap_complete = "3.1.1"
shellexpand = "2.1"

indexmap = "1"
regex = "1"
either = "1"
itertools = "0.10"

[[bin]]
name = "basc"
path = "bin/basc.rs"

[patch."https://github.com/minghu6/m6syntax"]
m6parserkit = { path = "../m6syntax/m6parserkit/" }
